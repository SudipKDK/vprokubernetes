apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: vpro-gateway
spec:
  gatewayClassName: nginx 
  listeners:
    - name: http
      protocol: HTTP
      port: 80
      allowedRoutes:
        namespaces:
          from: Same
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: vpro-route
spec:
  parentRefs:
    - name: vpro-gateway
  hostnames:
    - "vprofile.hkhinfoteck.xyz"
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: vproapp-service
          port: 8080
